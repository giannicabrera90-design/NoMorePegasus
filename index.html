<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=/en/">
    <title>NoMorePegasus - Global Anti-Spyware Initiative</title>
    <script>
        const userLang = navigator.language || navigator.userLanguage;
        const shortLang = userLang.split('-')[0];
        
        // Lista de carpetas que creaste
        const supportedLangs = ['en', 'es', 'fr', 'de', 'ru', 'ar', 'zh', 'pt', 'zht_Hant', 'ko', 'ja', 'th', 'ta', 'fa', 'he', 'bg', 'uk', 'el', 'cs', 'cro', 'et', 'tu', 'sv', 'fi', 'sl', 'sk', 'ro', 'pl', 'pap', 'no', 'nl', 'ms', 'hu', 'lt', 'lv', 'it', 'da', 'id'];

        if (supportedLangs.includes(shortLang)) {
            window.location.href = `/${shortLang}/`;
        } else {
            window.location.href = '/en/';
        }
    </script>
</head>
<body style="background-color: #032b1f; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <p>Loading NoMorePegasus...</p>
</body>
</html>
